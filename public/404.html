<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Additional styling for the image to shrink with screen size */
        img {
            width: 100%; /* Make image responsive */
            max-width: 300px !important; /* Limit maximum width */
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="text-center">
        <h1 class="display-1 text-danger fw-bold">404</h1>
        <p class="fs-4">Oops! Looks like this page didn’t pass the connection test in ComLab!</p>
        <img src="https://imgflip.com/s/meme/Computer-Guy.jpg" alt="nani?" class="img-fluid my-4">
        <p class="text-muted">Maybe it’s stuck on “Loading… Please Wait” forever. <br> Try restarting or head back to the homepage.</p>
        <a href="/" class="btn btn-primary btn-lg mt-3">
            <i class="bi bi-arrow-left"></i> Go Back Home
        </a>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
